site:
  title: EclipseStore Reference Manual
  url: https://docs.eclipsestore.io/
  start_page: manual:intro:welcome.adoc
  robots: allow
content:
  sources:
  - url: https://github.com/eclipse-store/store.git
    branches: release/1x
    start_path: docs
  - url: https://github.com/eclipse-store/store.git
    branches: release/2x
    start_path: docs
  - url: https://github.com/eclipse-store/store.git
    branches: release/3x
    start_path: docs
  - url: https://github.com/eclipse-store/store.git
    branches: main
    start_path: docs
asciidoc:
  attributes:
    page-pagination: ''
    source-language: asciidoc@
    # Soft-set so CI can override it with the current year via --attribute.
    page-copyright-year: '2026@'
ui:
  bundle:
    url: ./ui/ui-bundle.zip
  supplemental_files: ./supplemental-ui
output:
  # Served by GitHub Pages from main:/docs. Generated - never edit by hand.
  dir: ./docs
  clean: true
antora:
  extensions:
  - require: '@antora/lunr-extension'
