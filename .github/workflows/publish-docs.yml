name: Publish docs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload the artifact only; do not commit or push'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # commit docs/ back to main
      pages: write      # request the legacy Pages build
    steps:
      - name: Check out main
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site with Antora
        run: npm run build -- --attribute page-copyright-year="$(date -u +%Y)"

      - name: Sanity-check Antora output
        run: |
          set -euo pipefail
          test -s docs/manual/index.html
          test -s docs/search-index.js
          test -s docs/404.html
          test -d docs/_

      - name: Apply the static overlay
        run: |
          set -euo pipefail
          cp -a overlay/. docs/
          test -f docs/.nojekyll
          # tolerate a stray CR if the file was ever committed from Windows
          tr -d '\r' < docs/CNAME | grep -qx 'docs.eclipsestore.io'
          test -s docs/index.html

      - name: Upload the built site as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.run_id }}
          path: docs/
          retention-days: 14
          include-hidden-files: true   # .nojekyll would be dropped otherwise

      - name: Commit and push docs/
        id: publish
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          # Two files change on every build regardless of content and must be excluded
          # from change detection, otherwise every run would commit ~3 MB of noise:
          #   sitemap.xml     - embeds the build timestamp in every <lastmod>
          #   search-index.js - the lunr extension does not generate it deterministically
          # Any real documentation change also rewrites HTML (page body and nav), so
          # this cannot hide an actual update.
          if [ -z "$(git diff --cached --name-only -- docs \
                       ':(exclude)docs/sitemap.xml' \
                       ':(exclude)docs/search-index.js')" ]; then
            echo 'No content changes; skipping publish.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            git reset --hard
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git diff --cached --stat | tail -20
          git commit -m 'Rebuild site' \
                     -m 'run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          git push origin HEAD:main

      - name: Request and await the Pages build
        if: ${{ !inputs.dry_run && steps.publish.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent || true
          for _ in $(seq 1 30); do
            status="$(gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .status)"
            echo "pages build status: $status"
            case "$status" in
              built)   exit 0 ;;
              errored) gh api "repos/${{ github.repository }}/pages/builds/latest" --jq .error.message; exit 1 ;;
            esac
            sleep 10
          done
          echo '::warning::Timed out waiting for the Pages build.'

      - name: Summary
        if: always()
        run: |
          {
            echo '### Publish docs'
            echo "- dry run: \`${{ inputs.dry_run }}\`"
            echo "- changed: \`${{ steps.publish.outputs.changed || 'n/a' }}\`"
            echo '- site: https://docs.eclipsestore.io/'
          } >> "$GITHUB_STEP_SUMMARY"
